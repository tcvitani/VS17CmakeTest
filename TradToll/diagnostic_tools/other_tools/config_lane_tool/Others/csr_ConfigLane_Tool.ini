; ********** GENERAL CONFIG LANE TOOL SETTINGS *********

[GENERAL_SETTINGS]
DefaultLanguage=English
LanguageFilePath=./ConfigLane/csr_ConfigLane_Tool_Languages.xml
StylesheetPath=./ConfigLane/csr_ConfigLane_Style.css
DialogStylesheetPath=./ConfigLane/csr_ConfigLane_Dialog_Style.css
TraceAndErrorFileNamePrefix=csr_ConfigLane_Tool
AboutDialogLogoPath=":/Images/EmovisLogo.png"
WindowIconPath=./Images/ConfigLane.png
TraceFileEnabled=true
ErrorFileEnabled=true
TracePath=../_traces
ErrorPath=../_errors
FileMaxSize=1
VirtualKeyboardPath=C:/Windows/System32/osk.exe
;If WindowSize is blank, 0x0 or some invalid value, default value will be used!
WindowSize=
;If WindowPosition is blank or some invalid value, default value will be used! Position format: x.y
WindowPosition=

InstanceName="CFG_LANE_TOOL_MAIN_WND_LBL_INSTANCE_NAME1"

; *********** CONFIG LANE TOOL SETTINGS ***********

[CFG_LANE_TOOL_PARAMS]
DoNotShowGeneralParamTab=false
DoNotShowNetworkParamTab=true
DoNotShowPlazaSpecificParamTab=true
DoNotShowLaneSpecificParamTab=false
DoNotShowDevicesParamTab=false
DoNotShowChannelNumber=true
DoNotShowDualLane=true
DoNotShowLaneDirection=true
DoNotShowFarePoint=false
DoNotShowBtnGeneralGetActualCfg=false
DoNotShowBtnGeneralGetDefaultCfg=false
DoNotShowBtnPlazaSpecGetActualCfg=false
DoNotShowBtnPlazaSpecGetDefaultCfg=false
DoNotShowBtnLaneSpecGetActualCfg=false
DoNotShowBtnLaneSpecGetDefaultCfg=false
DoNotShowBtnDevicesGetActualCfg=false
DoNotShowBtnDevicesGetDefaultCfg=false

MinPlazaNum=1
MaxPlazaNum=2

MinLaneNum=1
MaxLaneNum=70

MinChannelNum=1
MaxChannelNum=70

ValuePlazaName=PlazaName
ValuePlazaNumber=PlazaNumber
ValueLaneName=LaneName
ValueLaneNumber=LaneNumber
ValueLaneType=Lane_configuration
ValueMessageServer=_MSG_Server
ValueFileServer=_FILE_Server
ValueLaneDirection=Lane_direction
ValueFarePoint=FarePoint
ValueDualLane=DualLanePresent
ValueHostName=Hostname
ValueNVHostName=NV Hostname

RegKeyAppParameters=LaneController\\Project\\Parameters\\GeneralData
RegKeyDevParameters=LaneController\\Project\\Parameters\\Devices
RegKeyModule_LAN=LaneController\\Config\\Modules\\LAN\\BL_LAN
RegKeyModule_TFT=LaneController\\Config\\Modules\\TFT\\BL_TFT

ForcePcShutDown=false
ShutDownPcMessage=true
AskForColdStart=true

RegEditCmd=regedit.exe /S
ShutDownCmd=shutdown /r /c /y /t 1

; command to enable DHCP, %s => network adapter name
SetDhcpCmd=netsh interface ip set address name=\"%s\" dhcp

; command to set an static IP address 
; 1st %s => network adapter name
; 2nd %s => IP address
; 3rd %s => IP mask
; 4th %s => default gateway
SetIpAddressCmd=netsh interface ip set address name=\"%s\" static %s %s %s 1

; command to update work group
; 1st %s => computer name
; 2nd %s => work group to set
UpdateWorkGroupCmd=NETDOM18 MEMBER \\\\%s /JOINWORKGROUP %s

; command for windows firewall
WindowsFirewallCmd=

RegKeyForHostName=SYSTEM\\CurrentControlSet\\Services\\Tcpip\\Parameters\\

ContextFile=c:\\csr\\context\\ctx.txt

SpecParamStringMaxLength=50
SpecParamNumberInputMask=999999999

ShowAllNetworkAdapters=false

